spring:
  datasource:
    # concurrentAccessResolution=2: read the last committed row instead of waiting on other transactions' locks
    # no defaults for host or database: a missing env var fails the run rather than connecting somewhere unintended
    url: jdbc:db2://${DB_HOST}:${DB_PORT:50000}/${DB_NAME}:concurrentAccessResolution=2;
    username: ${DB_USER}
    password: ${DB_PASSWORD}
